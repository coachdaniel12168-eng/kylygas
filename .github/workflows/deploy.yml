name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage deployable files
        run: |
          mkdir -p stage/functions
          cp *.html stage/
          cp og-image.png stage/ 2>/dev/null || true
          cp *.js stage/ 2>/dev/null || true
          cp *.svg *.ico *.webp stage/ 2>/dev/null || true
          cp _headers robots.txt sitemap.xml stage/
          cp *.txt stage/ 2>/dev/null || true
          cp functions/*.js stage/functions/

      - name: Guard - staged pages must not reference an unpublished asset
        run: |
          python3 - <<'EOF'
          import re, os, sys, glob
          missing = []
          for p in sorted(glob.glob("stage/*.html")):
              h = open(p, encoding="utf-8", errors="replace").read()
              for m in re.finditer(r'(?:src|href)="(/[^"?#]+?)"', h):
                  f = m.group(1).lstrip("/")
                  if f and "." in os.path.basename(f) and not os.path.exists(os.path.join("stage", f)):
                      missing.append((os.path.basename(p), f))
          if missing:
              for a, b in sorted(set(missing)):
                  print("MISSING ASSET: %s references %s" % (a, b))
              sys.exit("DEPLOY BLOCKED: staged pages reference assets that are not published")
          print("asset guard PASS: every local reference in stage/ exists")
          EOF

      - name: Guard - FAQPage markup must be visible on the page
        run: |
          python3 - <<'EOF'
          import re, sys, glob, json, html
          bad = []
          for p in sorted(glob.glob("stage/*.html")):
              body = open(p, encoding="utf-8", errors="replace").read()
              vis = re.sub(r"<script\b.*?</script>", "", body, flags=re.S | re.I)
              vis = re.sub(r"<style\b.*?</style>", "", vis, flags=re.S | re.I)
              vis = re.sub(r"<[^>]*>", " ", vis)
              vis = re.sub(r"\s+", " ", html.unescape(vis))
              for blk in re.findall(r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>', body, flags=re.S | re.I):
                  try:
                      o = json.loads(blk)
                  except Exception:
                      continue
                  stack = [o]
                  while stack:
                      x = stack.pop()
                      if isinstance(x, dict):
                          if x.get("@type") == "FAQPage":
                              for q in x.get("mainEntity", []) or []:
                                  for label, s in (("question", q.get("name", "")),
                                                   ("answer", (q.get("acceptedAnswer") or {}).get("text", ""))):
                                      s = re.sub(r"\s+", " ", html.unescape(s or "")).strip()
                                      if s and s not in vis:
                                          bad.append((p, label, s[:60]))
                          stack.extend(x.values())
                      elif isinstance(x, list):
                          stack.extend(x)
          if bad:
              for p, label, s in bad:
                  print("FAQPAGE TEXT NOT VISIBLE: %s %s: %s" % (p, label, s))
              sys.exit("DEPLOY BLOCKED: FAQPage markup must describe content visible on the page")
          print("faq-visibility guard PASS: every FAQPage question and answer is visible on its page")
          EOF

      - name: Guard - JSON-LD dateModified must equal the sitemap lastmod
        run: |
          python3 - <<'EOF'
          import re, sys, os, glob
          sm = open("stage/sitemap.xml", encoding="utf-8").read()
          lm = dict(re.findall(r"<loc>([^<]+)</loc>(?:<priority>[^<]*</priority>)?<lastmod>([^<]+)</lastmod>", sm))
          if not lm:
              sys.exit("DEPLOY BLOCKED: sitemap.xml carries no <lastmod> values to compare")
          bad = []
          for url, d in sorted(lm.items()):
              path = url.split("proofposts.com", 1)[-1] or "/"
              fname = (path.strip("/") or "index") + ".html"
              for f in (["stage/index.html"] if path == "/" else ["stage/%s" % fname]):
                  if not os.path.exists(f):
                      continue
                  h = open(f, encoding="utf-8", errors="replace").read()
                  for v in sorted(set(re.findall(r'"dateModified"\s*:\s*"([^"]+)"', h))):
                      if v != d:
                          bad.append((path, v, d))
          if bad:
              for p, v, d in bad:
                  print("DATE DISAGREEMENT: %s JSON-LD dateModified=%s sitemap lastmod=%s" % (p, v, d))
              sys.exit("DEPLOY BLOCKED: a page's JSON-LD date and its sitemap lastmod must agree")
          print("date-consistency guard PASS: every staged dateModified equals its sitemap lastmod")
          EOF

      - name: Guard - no orphan page in the sitemap
        run: |
          python3 - <<'EOF'
          import re, sys, os, glob
          sm = open("stage/sitemap.xml", encoding="utf-8").read()
          locs = re.findall(r"<loc>([^<]+)</loc>", sm)
          inbound = {}
          for f in sorted(glob.glob("stage/*.html")):
              me = "/" + os.path.basename(f)[:-5]
              if os.path.basename(f) == "index.html":
                  me = "/"
              h = open(f, encoding="utf-8", errors="replace").read()
              for href in re.findall(r'href="([^"]+)"', h):
                  if href.startswith(("mailto:", "tel:", "#", "javascript:")):
                      continue
                  if href.startswith("http"):
                      if "proofposts.com" not in href:
                          continue
                      tgt = "/" + href.split("proofposts.com", 1)[1].lstrip("/")
                  else:
                      tgt = "/" + href.lstrip("/")
                  tgt = tgt.split("#")[0].split("?")[0]
                  if tgt.endswith(".html"):
                      tgt = tgt[:-5] or "/"
                  if tgt != me:
                      inbound.setdefault(tgt, set()).add(me)
          orphans = [(u, [(u.split("proofposts.com", 1)[-1] or "/")]) for u in locs
                     if (u.split("proofposts.com", 1)[-1] or "/") not in inbound]
          if orphans:
              for u, p in orphans:
                  print("ORPHAN IN SITEMAP: %s is linked from no other page" % p[0])
              sys.exit("DEPLOY BLOCKED: every sitemap URL must be reachable by an internal link")
          print("orphan guard PASS: every sitemap URL is linked from another published page")
          EOF

      - name: Guard - retired claims must not come back
        run: |
          python3 - <<'EOF'
          import sys, glob
          # Each pattern was measured live on 30 Sep 2026 and removed by hand.
          # A later job that writes one of them back is blocked at deploy time.
          BANNED = [
              ("Every time", "an absolute guarantee about model output"),
              ("Google / BrightEdge", "a merged attribution Google never published"),
              ("below 50%", "an unsourced claim about a population we have not measured"),
              ("500+ words", "a word-count rule; Google states there is no ideal page length"),
              ("1,000+ words", "a word-count rule; Google states there is no ideal page length"),
              ("3-5x the rate", "an unsourced multiplier"),
              ("excerpted 3x", "an unsourced multiplier"),
          ]
          bad = []
          for p in sorted(glob.glob("stage/*.html")):
              h = open(p, encoding="utf-8", errors="replace").read()
              for s, why in BANNED:
                  if s in h:
                      bad.append((p, s, why))
          if bad:
              for p, s, why in bad:
                  print("RETIRED CLAIM BACK: %s contains %r (%s)" % (p, s, why))
              sys.exit("DEPLOY BLOCKED: a claim retired on 30 Sep 2026 was reintroduced")
          print("retired-claims guard PASS")
          EOF

      - name: Guard - every published page must be in the sitemap or declare noindex
        run: |
          python3 - <<'EOF'
          import re, sys, os, glob
          sm = open("stage/sitemap.xml", encoding="utf-8").read()
          locs = re.findall(r"<loc>([^<]+)</loc>", sm)
          paths = set()
          for u in locs:
              p = u.split("proofposts.com", 1)[-1] or "/"
              p = p.split("#")[0].split("?")[0]
              if p.endswith(".html"):
                  p = p[:-5] or "/"
              paths.add(p)
          bad = []
          for f in sorted(glob.glob("stage/*.html")):
              b = os.path.basename(f)
              me = "/" if b == "index.html" else "/" + b[:-5]
              if me in paths:
                  continue
              h = open(f, encoding="utf-8", errors="replace").read()
              m = re.search(r"<meta[^>]*name=[\"\x27]robots[\"\x27][^>]*content=[\"\x27]([^\"\x27]*)[\"\x27]", h, re.I)
              if m and "noindex" in m.group(1).lower():
                  print("exempt (noindex): %s" % b)
                  continue
              bad.append((b, me))
          if bad:
              for b, m in bad:
                  print("PUBLISHED BUT NOT IN SITEMAP AND NOT NOINDEX: %s -> %s" % (b, m))
              sys.exit("DEPLOY BLOCKED: every published page must be in sitemap.xml or declare noindex")
          print("sitemap-coverage guard PASS: every published page is in the sitemap or noindex")
          EOF

      - name: Guard - the date a page prints must equal its sitemap lastmod
        run: |
          python3 - <<'EOF'
          import re, sys, os, glob
          MONTHS = "January February March April May June July August September October November December".split()
          sm = open("stage/sitemap.xml", encoding="utf-8").read()
          lm = dict(re.findall(r"<loc>([^<]+)</loc>(?:<priority>[^<]*</priority>)?<lastmod>([^<]+)</lastmod>", sm))
          bad = []
          checked = 0
          for u, d in sorted(lm.items()):
              path = u.split("proofposts.com", 1)[-1] or "/"
              b = (path.strip("/") or "index") + ".html"
              f = "stage/" + b
              if not os.path.exists(f):
                  continue
              h = open(f, encoding="utf-8", errors="replace").read()
              for m in re.findall(r"Updated:?\s*([0-9]{1,2}) ([A-Z][a-z]+) (20[0-9]{2})", h):
                  checked += 1
                  try:
                      printed = "%s-%02d-%02d" % (m[2], MONTHS.index(m[1]) + 1, int(m[0]))
                  except ValueError:
                      bad.append((b, "unparseable date " + " ".join(m), d))
                      continue
                  if printed != d:
                      bad.append((b, printed, d))
          if bad:
              for b, p, d in bad:
                  print("DATE PRINTED != SITEMAP LASTMOD: %s prints %s, sitemap says %s" % (b, p, d))
              sys.exit("DEPLOY BLOCKED: the date a page prints must equal its sitemap lastmod")
          print("printed-date guard PASS: %d page(s) print the same date their sitemap entry carries" % checked)
          EOF

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: npx wrangler@latest pages deploy stage --project-name=proofposts --branch=main
